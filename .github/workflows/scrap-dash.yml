name: SCRAP DASH Unity CI

on:
  pull_request:
    paths:
      - 'games/001_scrap_dash/**'
      - '.github/workflows/scrap-dash.yml'
  push:
    branches: [main]
    paths:
      - 'games/001_scrap_dash/**'
      - '.github/workflows/scrap-dash.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  PROJECT_PATH: games/001_scrap_dash
  UNITY_VERSION: 6000.3.13f1

jobs:
  source-contract:
    name: Project and progress contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate project metadata and generated progress
        shell: bash
        run: |
          set -euo pipefail
          python3 games/001_scrap_dash/tools/generate_progress.py --check
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("games/001_scrap_dash")
          version = (root / "ProjectSettings/ProjectVersion.txt").read_text(encoding="utf-8")
          assert "6000.3.13f1" in version
          manifest = json.loads((root / "Packages/manifest.json").read_text(encoding="utf-8"))
          assert manifest["dependencies"]["com.unity.inputsystem"] == "1.16.0"
          for name in ("progress-card.svg", "progress-mini.svg", "progress-template.svg"):
              ET.parse(root / "assets/readme" / name)
          playmode = "\n".join(path.read_text(encoding="utf-8") for path in (root / "Assets/Tests/PlayMode").glob("*.cs"))
          assert playmode.count("[UnityTest]") >= 14
          PY

  tests:
    name: Unity EditMode + PlayMode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: games/001_scrap_dash/Library
          key: scrap-dash-library-tests-${{ hashFiles('games/001_scrap_dash/Assets/**', 'games/001_scrap_dash/Packages/**', 'games/001_scrap_dash/ProjectSettings/**') }}
          restore-keys: |
            scrap-dash-library-tests-

      - name: Normalize Unity Personal license
        shell: bash
        env:
          RAW_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ.get("RAW_UNITY_LICENSE", "")
          if not raw:
              raise SystemExit("UNITY_LICENSE secret is empty")

          # GitHub secrets can preserve a BOM/leading newline or Windows CRLF
          # from copy/paste. Unity's ULF parser expects XML from byte 0.
          value = raw.replace("\r\n", "\n").replace("\r", "\n")
          value = value.lstrip("\ufeff \t\n")

          if value.startswith('"') and value.endswith('"'):
              value = value[1:-1].strip()

          if not value.startswith("<"):
              raise SystemExit("UNITY_LICENSE is present but does not start with XML after normalization")

          env_file = Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8", newline="\n") as handle:
              handle.write("UNITY_LICENSE_NORMALIZED<<__SCRAP_DASH_ULF__\n")
              handle.write(value)
              if not value.endswith("\n"):
                  handle.write("\n")
              handle.write("__SCRAP_DASH_ULF__\n")
          PY

      - name: Run Unity tests
        id: unityTests
        uses: game-ci/unity-test-runner@v4.3.1
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE_NORMALIZED }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: SCRAP DASH Unity Tests

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCRAP-DASH-Test-Results
          path: ${{ steps.unityTests.outputs.artifactsPath }}
          if-no-files-found: ignore

  windows-demo:
    name: Windows x64 Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: games/001_scrap_dash/Library
          key: scrap-dash-library-windows-${{ hashFiles('games/001_scrap_dash/Assets/**', 'games/001_scrap_dash/Packages/**', 'games/001_scrap_dash/ProjectSettings/**') }}
          restore-keys: |
            scrap-dash-library-windows-

      - name: Normalize Unity Personal license
        shell: bash
        env:
          RAW_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ.get("RAW_UNITY_LICENSE", "")
          if not raw:
              raise SystemExit("UNITY_LICENSE secret is empty")

          # GitHub secrets can preserve a BOM/leading newline or Windows CRLF
          # from copy/paste. Unity's ULF parser expects XML from byte 0.
          value = raw.replace("\r\n", "\n").replace("\r", "\n")
          value = value.lstrip("\ufeff \t\n")

          if value.startswith('"') and value.endswith('"'):
              value = value[1:-1].strip()

          if not value.startswith("<"):
              raise SystemExit("UNITY_LICENSE is present but does not start with XML after normalization")

          env_file = Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8", newline="\n") as handle:
              handle.write("UNITY_LICENSE_NORMALIZED<<__SCRAP_DASH_ULF__\n")
              handle.write(value)
              if not value.endswith("\n"):
                  handle.write("\n")
              handle.write("__SCRAP_DASH_ULF__\n")
          PY

      - name: Build Windows x64
        uses: game-ci/unity-builder@v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: ScrapDashDemo
          buildsPath: build
          allowDirtyBuild: true
          versioning: Semantic

      - name: Verify EXE and write SHA-256
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find build -type f -iname '*.exe' -print -quit)"
          if [ -z "$exe" ]; then
            echo "No Windows .exe was produced."
            exit 1
          fi
          echo "Windows demo executable: $exe"
          sha256sum "$exe" | tee build/SHA256SUMS.txt

      - name: Upload Windows demo
        uses: actions/upload-artifact@v4
        with:
          name: SCRAP-DASH-Level1-Windows
          path: build
          if-no-files-found: error
