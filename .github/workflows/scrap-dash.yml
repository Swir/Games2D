name: SCRAP DASH Unity CI

on:
  pull_request:
    paths:
      - 'games/001_scrap_dash/**'
      - '.github/workflows/scrap-dash.yml'
  push:
    branches: [main]
    paths:
      - 'games/001_scrap_dash/**'
      - '.github/workflows/scrap-dash.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  PROJECT_PATH: games/001_scrap_dash
  UNITY_VERSION: 6000.3.13f1

jobs:
  source-contract:
    name: Project and progress contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate project metadata and generated progress
        shell: bash
        run: |
          set -euo pipefail
          python3 games/001_scrap_dash/tools/generate_progress.py --check
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("games/001_scrap_dash")
          version = (root / "ProjectSettings/ProjectVersion.txt").read_text(encoding="utf-8")
          assert "6000.3.13f1" in version
          player_settings = (root / "ProjectSettings/ProjectSettings.asset").read_text(encoding="utf-8")
          assert "serializedVersion: 28" in player_settings
          assert "productName: SCRAP DASH" in player_settings
          assert "defaultScreenWidth: 1920" in player_settings
          assert "defaultScreenHeight: 1080" in player_settings
          assert "resizableWindow: 1" in player_settings
          assert "activeInputHandler: 1" in player_settings
          assert "scriptingBackend:\n    Standalone: 0" in player_settings
          manifest = json.loads((root / "Packages/manifest.json").read_text(encoding="utf-8"))
          assert manifest["dependencies"]["com.unity.inputsystem"] == "1.16.0"
          for name in ("progress-card.svg", "progress-mini.svg", "progress-template.svg"):
              ET.parse(root / "assets/readme" / name)
          playmode = "\n".join(path.read_text(encoding="utf-8") for path in (root / "Assets/Tests/PlayMode").glob("*.cs"))
          assert playmode.count("[UnityTest]") >= 23
          PY

  tests:
    name: Unity EditMode + PlayMode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize Unity ULF secret
        shell: bash
        env:
          RAW_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import html
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          raw = os.environ.get("RAW_UNITY_LICENSE", "")
          if not raw:
              raise SystemExit("UNITY_LICENSE is empty.")

          def clean(value: str) -> str:
              value = value.replace("\x00", "").lstrip("\ufeff").strip()
              for prefix in ("UNITY_LICENSE=", "UNITY_LICENSE:"):
                  if value.startswith(prefix):
                      value = value[len(prefix):].strip()
              if len(value) >= 2 and value[0] == value[-1] == '"':
                  try:
                      decoded = json.loads(value)
                      if isinstance(decoded, str):
                          value = decoded
                  except Exception:
                      value = value[1:-1]
              if "\n" not in value and "\\n" in value:
                  value = value.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\\r", "\n")
              value = html.unescape(value)
              return value.replace("\r\n", "\n").replace("\r", "\n").lstrip("\ufeff").strip()

          candidates = [clean(raw)]
          encoded_sources = [raw]
          if "base64," in raw:
              encoded_sources.append(raw.split("base64,", 1)[1])
          for source in encoded_sources:
              compact = "".join(source.split())
              try:
                  decoded_bytes = base64.b64decode(compact, validate=True)
              except Exception:
                  continue
              for enc in ("utf-8-sig", "utf-16", "utf-16-le", "utf-16-be"):
                  try:
                      candidates.append(clean(decoded_bytes.decode(enc)))
                  except (UnicodeDecodeError, UnicodeError):
                      continue

          license_text = None
          saw_xml_marker = False
          for candidate in candidates:
              snippets = [candidate]
              for marker in ("<?xml", "<root"):
                  start_at = candidate.find(marker)
                  end_at = candidate.rfind(">")
                  if start_at >= 0 and end_at > start_at:
                      saw_xml_marker = True
                      snippets.append(candidate[start_at:end_at + 1])
              for snippet in snippets:
                  try:
                      root = ET.fromstring(snippet)
                  except ET.ParseError:
                      continue
                  if root.tag.lower().endswith("root") or root.find(".//License") is not None:
                      license_text = snippet
                      break
              if license_text is not None:
                  break

          if license_text is None:
              marker = "present-but-invalid" if saw_xml_marker else "missing"
              raise SystemExit(
                  "UNITY_LICENSE is present but no valid ULF XML could be recovered "
                  f"(XML marker: {marker}; decoded candidates: {len(candidates)}). "
                  "The secret must contain the file contents beginning with <?xml or <root, "
                  "not a path, filename, screenshot, certificate text or Hub account token."
              )

          # Mask every non-empty line before exporting the normalized value.
          for line in license_text.splitlines():
              if line.strip():
                  escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::add-mask::{escaped}")

          env_file = Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8", newline="\n") as fh:
              fh.write("UNITY_LICENSE<<__UNITY_LICENSE_EOF__\n")
              fh.write(license_text)
              fh.write("\n__UNITY_LICENSE_EOF__\n")

          print("UNITY_LICENSE: valid ULF XML safely recovered and normalized.")
          PY

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: games/001_scrap_dash/Library
          key: scrap-dash-library-tests-${{ hashFiles('games/001_scrap_dash/Assets/**', 'games/001_scrap_dash/Packages/**', 'games/001_scrap_dash/ProjectSettings/**') }}
          restore-keys: |
            scrap-dash-library-tests-

      - name: Run Unity tests
        id: unityTests
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          cliVersion: v0.1.69
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: SCRAP DASH Unity Tests

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCRAP-DASH-Test-Results
          path: ${{ steps.unityTests.outputs.artifactsPath || 'artifacts' }}
          if-no-files-found: ignore

  windows-demo:
    name: Windows x64 Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize Unity ULF secret
        shell: bash
        env:
          RAW_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
