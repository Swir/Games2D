                  if value.startswith(prefix):
                      value = value[len(prefix):].strip()
              if len(value) >= 2 and value[0] == value[-1] == '"':
                  try:
                      decoded = json.loads(value)
                      if isinstance(decoded, str):
                          value = decoded
                  except Exception:
                      value = value[1:-1]
              if "\n" not in value and "\\n" in value:
                  value = value.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\\r", "\n")
              value = html.unescape(value)
              return value.replace("\r\n", "\n").replace("\r", "\n").lstrip("\ufeff").strip()

          candidates = [clean(raw)]
          encoded_sources = [raw]
          if "base64," in raw:
              encoded_sources.append(raw.split("base64,", 1)[1])
          for source in encoded_sources:
              compact = "".join(source.split())
              try:
                  decoded_bytes = base64.b64decode(compact, validate=True)
              except Exception:
                  continue
              for enc in ("utf-8-sig", "utf-16", "utf-16-le", "utf-16-be"):
                  try:
                      candidates.append(clean(decoded_bytes.decode(enc)))
                  except (UnicodeDecodeError, UnicodeError):
                      continue

          license_text = None
          saw_xml_marker = False
          for candidate in candidates:
              snippets = [candidate]
              for marker in ("<?xml", "<root"):
                  start_at = candidate.find(marker)
                  end_at = candidate.rfind(">")
